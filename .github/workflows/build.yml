
name: Build Input Adjuster

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Android ARM64
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          target: Android64
          sdk: given

      - name: Upload mod
        uses: actions/upload-artifact@v4
        with:
          name: Input-Adjuster-Android64
          path: ${{ steps.build.outputs.build-output }}
          
